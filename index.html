function EtapaRow({ etapa, index, onChange, onRemove, canRemove }) {
  return (
    <div className="rounded-lg p-3 mb-2" style={{ background: BG }}>
      <div className="grid md:grid-cols-5 gap-3 items-end">
        <div className="text-sm font-bold" style={{ color: NAVY }}>Etapa {index + 1}</div>
        <Field label="Ancho (m)"><input type="number" className={inputCls} style={inputStyle} value={etapa.ancho} onChange={(e) => onChange({ ancho: e.target.value })} /></Field>
        <Field label="Largo (m)"><input type="number" className={inputCls} style={inputStyle} value={etapa.largo} onChange={(e) => onChange({ largo: e.target.value })} /></Field>
        <Field label="N° de pórticos"><input type="number" className={inputCls} style={inputStyle} value={etapa.porticos} onChange={(e) => onChange({ porticos: e.target.value })} /></Field>
        <Field label="Responsable">
          <select className={inputCls} style={inputStyle} value={etapa.responsable || ""} onChange={(e) => onChange({ responsable: e.target.value })}>
            <option value="">Selecciona...</option>
            {RESPONSABLES.map((r) => <option key={r} value={r}>{r}</option>)}
          </select>
        </Field>
      </div>
      <div className="grid md:grid-cols-4 gap-3 mt-2 items-end">
        <Field label="Fecha inicio"><input type="date" className={inputCls} style={inputStyle} value={etapa.fechaInicio || ""} onChange={(e) => onChange({ fechaInicio: e.target.value })} /></Field>
        <Field label="Fecha fin"><input type="date" className={inputCls} style={inputStyle} value={etapa.fechaFin || ""} onChange={(e) => onChange({ fechaFin: e.target.value })} /></Field>
        <Field label="Estado de la etapa">
          <select className={inputCls} style={inputStyle} value={etapa.estado || "En curso"} onChange={(e) => onChange({ estado: e.target.value })}>
            {["En curso","Completado","Pendiente","Reprogramado"].map(s => <option key={s}>{s}</option>)}
          </select>
        </Field>
        <div className="flex flex-col gap-1">
          <div className="text-xs font-medium" style={{ color: SLATE }}>Área / Duración</div>
          <div className="text-xs py-2 px-3 rounded-lg" style={{ background: GREEN + "22", color: GREEN, fontWeight: 600 }}>
            {round1((parseFloat(etapa.ancho)||0)*(parseFloat(etapa.largo)||0))} m²
            {etapa.fechaInicio && etapa.fechaFin ? ` · ${Math.max(0, Math.round((new Date(etapa.fechaFin)-new Date(etapa.fechaInicio))/(86400000)))} días` : ""}
          </div>
        </div>
      </div>
      <div className="flex justify-end mt-2">
        {canRemove && (
          <button onClick={onRemove} className="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold border" style={{ borderColor: "#C0392B", color: "#C0392B" }}>
            <Trash2 size={13} /> Quitar etapa
          </button>
        )}
      </div>
    </div>
  );
}

function DatosTab({ draft, setDraft, onSave, stats }) {
  const tieneEtapas = draft.etapas && draft.etapas.length > 0;
  const totales = projectTotals(draft);
  const addEtapa = () => setDraft({ ...draft, etapas: [...(draft.etapas || []), blankEtapa()] });
  const updateEtapa = (id, patch) => setDraft({ ...draft, etapas: draft.etapas.map((e) => (e.id === id ? { ...e, ...patch } : e)) });
  const removeEtapa = (id) => setDraft({ ...draft, etapas: draft.etapas.filter((e) => e.id !== id) });

  return (
    <div className="flex flex-col gap-4">
      <h2 className="text-lg font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Datos del proyecto</h2>
      <Card className="p-5">
        <div className="grid md:grid-cols-3 gap-4">
          <Field label="Nombre / Código"><input className={inputCls} style={inputStyle} value={draft.nombre || ""} onChange={(e) => setDraft({ ...draft, nombre: e.target.value })} /></Field>
          <Field label="Cliente"><input className={inputCls} style={inputStyle} value={draft.cliente || ""} onChange={(e) => setDraft({ ...draft, cliente: e.target.value })} /></Field>
          <Field label="Ubicación"><input className={inputCls} style={inputStyle} value={draft.ubicacion || ""} onChange={(e) => setDraft({ ...draft, ubicacion: e.target.value })} /></Field>
          <Field label={tieneEtapas ? "Ancho (m) — suma de etapas" : "Ancho (m)"}>
            <input disabled={tieneEtapas} type="number" className={inputCls} style={tieneEtapas ? { ...inputStyle, background: BG } : inputStyle}
              value={tieneEtapas ? "Varía por etapa" : (draft.ancho || "")} onChange={(e) => setDraft({ ...draft, ancho: e.target.value })} />
          </Field>
          <Field label={tieneEtapas ? "N° de pórticos (total)" : "N° de pórticos"}>
            <input disabled={tieneEtapas} type="number" className={inputCls} style={tieneEtapas ? { ...inputStyle, background: BG } : inputStyle}
              value={tieneEtapas ? totales.porticos : (draft.porticos || "")} onChange={(e) => setDraft({ ...draft, porticos: e.target.value })} />
          </Field>
          <Field label={tieneEtapas ? "Longitud (m) — suma de etapas" : "Longitud (m)"}>
            <input disabled={tieneEtapas} type="number" className={inputCls} style={tieneEtapas ? { ...inputStyle, background: BG } : inputStyle}
              value={tieneEtapas ? "Varía por etapa" : (draft.longitud || "")} onChange={(e) => setDraft({ ...draft, longitud: e.target.value })} />
          </Field>
          <Field label="Área total (m²)"><input disabled className={inputCls} style={{ ...inputStyle, background: BG }} value={round1(totales.area)} /></Field>
          <Field label="Cuadrilla asignada (N°)"><input type="number" className={inputCls} style={inputStyle} value={draft.cuadrilla || ""} onChange={(e) => setDraft({ ...draft, cuadrilla: e.target.value })} /></Field>
          <Field label="Responsable del proyecto">
            <select className={inputCls} style={inputStyle} value={draft.supervisor || ""} onChange={(e) => setDraft({ ...draft, supervisor: e.target.value })}>
              <option value="">Selecciona...</option>
              {RESPONSABLES.map((r) => <option key={r} value={r}>{r}</option>)}
            </select>
          </Field>
        </div>

        <div className="mt-5 pt-4" style={{ borderTop: `1px solid ${LINE}` }}>
          <div className="flex items-center justify-between mb-1">
            <div className="text-sm font-bold" style={{ color: NAVY }}>Etapas del proyecto</div>
            <button onClick={addEtapa} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold border" style={{ borderColor: STEEL, color: STEEL }}>
              <Plus size={14} /> Agregar etapa
            </button>
          </div>
          <div className="text-xs mb-3" style={{ color: MUTED }}>
            Si este proyecto se ejecuta por etapas, agrégalas aquí con su propia medida y responsable. El ancho, longitud y pórticos totales se calculan sumando todas las etapas.
          </div>
          {tieneEtapas ? (
            draft.etapas.map((etapa, i) => (
              <EtapaRow key={etapa.id} etapa={etapa} index={i}
                onChange={(patch) => updateEtapa(etapa.id, patch)}
                onRemove={() => removeEtapa(etapa.id)}
                canRemove={true} />
            ))
          ) : (
            <div className="text-xs italic" style={{ color: MUTED }}>Sin etapas — el proyecto se maneja con una sola medida (ancho/longitud/pórticos arriba).</div>
          )}
        </div>

        <div className="mt-5 pt-4" style={{ borderTop: `1px solid ${LINE}` }}>
          <div className="text-sm font-bold mb-3" style={{ color: NAVY }}>Horario laboral</div>
          <div className="grid md:grid-cols-3 gap-4">
            <Field label="Horas/día Lunes a Viernes"><input type="number" className={inputCls} style={inputStyle} value={draft.horasLV ?? 10} onChange={(e) => setDraft({ ...draft, horasLV: e.target.value })} /></Field>
            <Field label="Horas/día Sábado"><input type="number" className={inputCls} style={inputStyle} value={draft.horasSab ?? 8} onChange={(e) => setDraft({ ...draft, horasSab: e.target.value })} /></Field>
            <Field label="¿Se labora el domingo?">
              <select className={inputCls} style={inputStyle} value={draft.domingoLabora ? "si" : "no"}
                onChange={(e) => setDraft({ ...draft, domingoLabora: e.target.value === "si" })}>
                <option value="no">No — domingo no laboral</option>
                <option value="si">Sí — domingo laboral</option>
              </select>
            </Field>
            {draft.domingoLabora ? (
              <Field label="Horas/día Domingo"><input type="number" className={inputCls} style={inputStyle} value={draft.horasDom ?? 0} onChange={(e) => setDraft({ ...draft, horasDom: e.target.value })} /></Field>
            ) : (
              <Field label="Domingo"><input disabled className={inputCls} style={{ ...inputStyle, background: BG }} value="No laboral" /></Field>
            )}
          </div>
        </div>

        <div className="mt-5 pt-4" style={{ borderTop: `1px solid ${LINE}` }}>
          <div className="text-sm font-bold mb-3" style={{ color: NAVY }}>Fechas programadas</div>
          <div className="grid md:grid-cols-3 gap-4">
            <Field label="Fecha inicio programada"><input type="date" className={inputCls} style={inputStyle} value={draft.fechaInicioProg || ""} onChange={(e) => setDraft({ ...draft, fechaInicioProg: e.target.value })} /></Field>
            <Field label="Fecha fin programada"><input type="date" className={inputCls} style={inputStyle} value={draft.fechaFinProg || ""} onChange={(e) => setDraft({ ...draft, fechaFinProg: e.target.value })} /></Field>
            <Field label="Estado del proyecto">
              <select className={inputCls} style={inputStyle} value={draft.estado || "En curso"} onChange={(e) => setDraft({ ...draft, estado: e.target.value })}>
                {["En curso", "Completado", "Suspendido", "Reprogramado"].map((s) => <option key={s}>{s}</option>)}
              </select>
            </Field>
          </div>
        </div>

        <div className="flex justify-end mt-5">
          <button onClick={onSave} className="flex items-center gap-2 px-4 py-2 rounded-lg text-white text-sm font-semibold" style={{ background: GREEN }}>
            <Save size={16} /> Guardar cambios
          </button>
        </div>
      </Card>
    </div>
  );
}

function FilaActividad({ fila, onChange, onRemove, canRemove, etapas }) {
  const faseObj = FASES.find((f) => f.key === fila.fase) || FASES[0];
  const [open, setOpen] = React.useState(false);
  const toggleSub = (s) => {
    const exists = fila.subs.includes(s);
    onChange({ subs: exists ? fila.subs.filter((x) => x !== s) : [...fila.subs, s] });
  };
  return (
    <div className="rounded-lg p-3 mb-2" style={{ background: BG }}>
      <div className="grid md:grid-cols-4 gap-3">
        {etapas.length > 0 && (
          <Field label="Etapa">
            <select className={inputCls} style={inputStyle} value={fila.etapaId || ""} onChange={(e) => onChange({ etapaId: e.target.value })}>
              <option value="">— Todas / General —</option>
              {etapas.map((et, i) => <option key={et.id} value={et.id}>Etapa {i+1}{et.responsable ? ` — ${et.responsable}` : ""}</option>)}
            </select>
          </Field>
        )}
        <Field label="Fase">
          <select className={inputCls} style={inputStyle} value={fila.fase}
            onChange={(e) => { onChange({ fase: e.target.value, subs: [] }); setOpen(false); }}>
            {FASES.map((f) => <option key={f.key} value={f.key}>{f.key.replace("FASE ", "Fase ")} — {f.nombre}</option>)}
          </select>
        </Field>
        <div className="md:col-span-2">
          <Field label={`Sub-actividades${fila.subs.length ? ` (${fila.subs.length} seleccionadas)` : ""}`}>
            <button type="button" onClick={() => setOpen((v) => !v)}
              className={`${inputCls} w-full text-left flex items-center justify-between gap-2`} style={inputStyle}>
              <span className="truncate" style={{ color: fila.subs.length ? SLATE : MUTED }}>
                {fila.subs.length ? fila.subs.join(" · ") : "Selecciona una o varias..."}
              </span>
              <ChevronRight size={14} style={{ color: MUTED, transform: open ? "rotate(90deg)" : "rotate(0deg)", flexShrink: 0 }} />
            </button>
          </Field>
          {open && (
            <div className="z-20 mt-1 w-full rounded-lg shadow-lg max-h-60 overflow-y-auto p-2" style={{ background: CARD, border: `1px solid ${LINE}` }}>
              {(() => {
                let lastGroup = null;
                return faseObj.subs.map((s) => {
                  const [grupo, resto] = s.includes(" — ") ? s.split(" — ") : [null, s];
                  const showHeader = grupo && grupo !== lastGroup;
                  lastGroup = grupo;
                  return (
                    <div key={s}>
                      {showHeader && (
                        <div className="px-2 pt-2 pb-1 text-[11px] font-bold uppercase tracking-wide" style={{ color: STEEL }}>{grupo}</div>
                      )}
                      <label className="flex items-start gap-2 px-2 py-1.5 rounded cursor-pointer text-sm" style={{ color: SLATE }}>
                        <input type="checkbox" checked={fila.subs.includes(s)} onChange={() => toggleSub(s)} className="mt-0.5" />
                        <span>{resto}</span>
                      </label>
                    </div>
                  );
                });
              })()}
              <button onClick={() => setOpen(false)} className="w-full mt-1 text-xs font-semibold py-1.5 rounded text-white" style={{ background: NAVY }}>
                Listo
              </button>
            </div>
          )}
        </div>
        <Field label="Estado">
          <select className={inputCls} style={inputStyle} value={fila.estado} onChange={(e) => onChange({ estado: e.target.value })}>
            {ESTADOS.map((s) => <option key={s}>{s}</option>)}
          </select>
        </Field>
        <Field label="Hora inicio"><input type="time" className={inputCls} style={inputStyle} value={fila.horaInicio} onChange={(e) => onChange({ horaInicio: e.target.value })} /></Field>
        <Field label="Hora fin"><input type="time" className={inputCls} style={inputStyle} value={fila.horaFin} onChange={(e) => onChange({ horaFin: e.target.value })} /></Field>
        <Field label="# Personal"><input type="number" className={inputCls} style={inputStyle} value={fila.personal} onChange={(e) => onChange({ personal: e.target.value })} /></Field>
        <Field label="Responsable"><input className={inputCls} style={inputStyle} value={fila.responsable} onChange={(e) => onChange({ responsable: e.target.value })} /></Field>
        <div className="md:col-span-3">
          <Field label="Observaciones"><input className={inputCls} style={inputStyle} value={fila.obs} onChange={(e) => onChange({ obs: e.target.value })} /></Field>
        </div>
        <div className="flex items-end justify-end">
          {canRemove && (
            <button onClick={onRemove} className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold border" style={{ borderColor: "#C0392B", color: "#C0392B" }}>
              <Trash2 size={14} /> Quitar
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function SeguimientoTab({ fechaRegistro, setFechaRegistro, filas, updateFila, addFila, removeFila, onGuardar, entries, onDelete, filtroFase, setFiltroFase, etapas, tiempoMuerto, setTiempoMuerto, showTM, setShowTM, onGuardarTM }) {
  const actEntries = entries.filter(e => e.tipo !== "tiempo_muerto");
  const tmEntries = entries.filter(e => e.tipo === "tiempo_muerto");
  const filtered = (filtroFase === "TODAS" ? actEntries : actEntries.filter((e) => e.fase === filtroFase))
    .slice().sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
  const fasesEnUso = new Set(filas.map((f) => f.fase)).size;

  return (
    <div className="flex flex-col gap-4">
      <h2 className="text-lg font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Seguimiento diario</h2>

      <Card className="p-5">
        <div className="flex items-center justify-between mb-3">
          <Field label="Fecha del registro">
            <input type="date" className={inputCls} style={inputStyle} value={fechaRegistro} onChange={(e) => setFechaRegistro(e.target.value)} />
          </Field>
          {fasesEnUso > 1 && (
            <Pill color={AMBER}>{fasesEnUso} fases en paralelo este día</Pill>
          )}
        </div>

        <div className="text-xs mb-2" style={{ color: MUTED }}>
          Agrega una fila por cada actividad realizada este día — pueden ser de fases distintas si el equipo trabajó en paralelo.
        </div>

        {filas.map((fila) => (
          <FilaActividad
            key={fila.id}
            fila={fila}
            onChange={(patch) => updateFila(fila.id, patch)}
            onRemove={() => removeFila(fila.id)}
            canRemove={filas.length > 1}
            etapas={etapas}
          />
        ))}

        <div className="flex items-center gap-2 mt-2">
          <button onClick={addFila} className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold border" style={{ borderColor: STEEL, color: STEEL }}>
            <Plus size={15} /> Agregar otra actividad en paralelo
          </button>
          <button onClick={onGuardar} className="flex items-center gap-2 px-4 py-2 rounded-lg text-white text-sm font-semibold" style={{ background: NAVY }}>
            <Save size={16} /> Guardar registros del día
          </button>
        </div>
      </Card>

      <div className="flex items-center justify-between">
        <div className="text-sm font-semibold" style={{ color: SLATE }}>Registros ({filtered.length})</div>
        <select className={`${inputCls} text-xs`} style={inputStyle} value={filtroFase} onChange={(e) => setFiltroFase(e.target.value)}>
          <option value="TODAS">Todas las fases</option>
          {FASES.map((f) => <option key={f.key} value={f.key}>{f.key.replace("FASE ", "Fase ")}</option>)}
        </select>
      </div>

      <Card className="overflow-hidden">
        <div className="overflow-x-auto max-h-[420px]">
          <table className="w-full text-sm">
            <thead style={{ background: BG }}>
              <tr>
                {["Fecha", "Fase", "Sub-actividad", "Horario", "Personal", "Responsable", "Estado", ""].map((h) => (
                  <th key={h} className="text-left px-3 py-2 font-semibold whitespace-nowrap" style={{ color: MUTED, fontSize: 11, textTransform: "uppercase" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((e) => (
                <tr key={e.id} style={{ borderTop: `1px solid ${LINE}` }}>
                  <td className="px-3 py-2 whitespace-nowrap">{fmtFecha(e.fecha)}</td>
                  <td className="px-3 py-2 whitespace-nowrap">{e.fase.replace("FASE ", "F")}</td>
                  <td className="px-3 py-2 max-w-[260px]">{e.sub}</td>
                  <td className="px-3 py-2 whitespace-nowrap">{e.horaInicio}–{e.horaFin}</td>
                  <td className="px-3 py-2 text-center">{e.personal || "—"}</td>
                  <td className="px-3 py-2 whitespace-nowrap">{e.responsable || "—"}</td>
                  <td className="px-3 py-2"><Pill color={ESTADO_COLOR[e.estado]}>{e.estado}</Pill></td>
                  <td className="px-3 py-2"><button onClick={() => onDelete(e.id)}><Trash2 size={15} style={{ color: "#C0392B" }} /></button></td>
                </tr>
              ))}
              {filtered.length === 0 && (
                <tr><td colSpan={8} className="px-3 py-8 text-center" style={{ color: MUTED }}>Aún no hay registros. Agrega el primero arriba.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Card>

      {/* ---- BLOQUE TIEMPOS MUERTOS ---- */}
      <div className="flex items-center justify-between mt-2">
        <div className="text-sm font-bold flex items-center gap-2" style={{ color: NAVY }}>
          <AlertTriangle size={16} color={AMBER} /> Tiempos muertos / Improductivos
        </div>
        <button onClick={() => setShowTM(v => !v)}
          className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold border"
          style={{ borderColor: AMBER, color: AMBER }}>
          <Plus size={14} /> {showTM ? "Cancelar" : "Registrar tiempo muerto"}
        </button>
      </div>

      {showTM && (
        <Card className="p-4" style={{ borderColor: AMBER }}>
          <div className="text-xs mb-3" style={{ color: MUTED }}>
            Registra aquí cualquier tiempo en que la cuadrilla estuvo parada por causas externas. Esto queda como sustento documental ante el cliente.
          </div>
          <div className="grid md:grid-cols-3 gap-3">
            <div className="md:col-span-2">
              <Field label="Motivo del tiempo muerto">
                <select className={inputCls} style={inputStyle} value={tiempoMuerto.motivo}
                  onChange={e => setTiempoMuerto({...tiempoMuerto, motivo: e.target.value})}>
                  {MOTIVOS_TIEMPO_MUERTO.map(m => <option key={m} value={m}>{m}</option>)}
                </select>
              </Field>
            </div>
            {etapas.length > 0 && (
              <Field label="Etapa afectada">
                <select className={inputCls} style={inputStyle} value={tiempoMuerto.etapaId || ""}
                  onChange={e => setTiempoMuerto({...tiempoMuerto, etapaId: e.target.value})}>
                  <option value="">— General —</option>
                  {etapas.map((et, i) => <option key={et.id} value={et.id}>Etapa {i+1}{et.responsable ? ` — ${et.responsable}` : ""}</option>)}
                </select>
              </Field>
            )}
            <Field label="Hora inicio"><input type="time" className={inputCls} style={inputStyle} value={tiempoMuerto.horaInicio} onChange={e => setTiempoMuerto({...tiempoMuerto, horaInicio: e.target.value})} /></Field>
            <Field label="Hora fin"><input type="time" className={inputCls} style={inputStyle} value={tiempoMuerto.horaFin} onChange={e => setTiempoMuerto({...tiempoMuerto, horaFin: e.target.value})} /></Field>
            <Field label="Duración (calculada)">
              <input disabled className={inputCls} style={{...inputStyle, background: BG}}
                value={(() => { const hi = tiempoMuerto.horaInicio.split(":").map(Number); const hf = tiempoMuerto.horaFin.split(":").map(Number); const d = Math.max(0,(hf[0]+hf[1]/60)-(hi[0]+hi[1]/60)); return d.toFixed(2) + " h"; })()}
              />
            </Field>
            <div className="md:col-span-3">
              <Field label="Descripción / observaciones">
                <input className={inputCls} style={inputStyle} value={tiempoMuerto.obs}
                  onChange={e => setTiempoMuerto({...tiempoMuerto, obs: e.target.value})}
                  placeholder="Detalla la situación para sustentar la demora ante el cliente..." />
              </Field>
            </div>
          </div>
          <div className="flex justify-end mt-3">
            <button onClick={onGuardarTM}
              className="flex items-center gap-2 px-4 py-2 rounded-lg text-white text-sm font-semibold"
              style={{ background: AMBER }}>
              <Save size={16} /> Guardar tiempo muerto
            </button>
          </div>
        </Card>
      )}

      {tmEntries.length > 0 && (
        <Card className="overflow-hidden">
          <div className="px-4 pt-3 pb-1 text-xs font-bold" style={{ color: AMBER }}>
            TIEMPOS MUERTOS REGISTRADOS — {round2(tmEntries.reduce((a,e)=>a+(parseFloat(e.duracionH)||0),0))} h total improductivas
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead style={{ background: "#FFF8EE" }}>
                <tr>
                  {["Fecha","Motivo","Horario","Duración","Observaciones",""].map(h => (
                    <th key={h} className="text-left px-3 py-2 font-semibold whitespace-nowrap" style={{ color: AMBER, fontSize: 11, textTransform: "uppercase" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {tmEntries.slice().sort((a,b) => a.fecha < b.fecha ? 1 : -1).map(e => (
                  <tr key={e.id} style={{ borderTop: `1px solid ${LINE}` }}>
                    <td className="px-3 py-2 whitespace-nowrap">{new Date(e.fecha+"T12:00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}</td>
                    <td className="px-3 py-2">{e.motivo}</td>
                    <td className="px-3 py-2 whitespace-nowrap">{e.horaInicio}–{e.horaFin}</td>
                    <td className="px-3 py-2 text-center font-bold" style={{ color: AMBER }}>{parseFloat(e.duracionH).toFixed(2)} h</td>
                    <td className="px-3 py-2" style={{ color: MUTED }}>{e.obs || "—"}</td>
                    <td className="px-3 py-2"><button onClick={() => onDelete(e.id)}><Trash2 size={15} style={{ color: "#C0392B" }} /></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      )}
    </div>
  );
}

function DashboardTab({ selected, stats, entries, onFinalizar, onResolverSub }) {
  if (!stats) return null;
  const chartData = stats.fasesStats.map((f) => ({ name: f.key.replace("FASE ", "F"), horas: f.horas }));
  const hayPendientes = stats.pendientes.length > 0;
  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Dashboard — {selected.nombre}</h2>
        {selected.estado !== "Completado" && (
          <div className="text-right">
            <button onClick={onFinalizar} disabled={hayPendientes}
              className="flex items-center gap-2 px-3.5 py-2 rounded-lg text-white text-sm font-semibold"
              style={{ background: hayPendientes ? "#B7C3D6" : GREEN, cursor: hayPendientes ? "not-allowed" : "pointer" }}>
              <CheckCircle2 size={16} /> Marcar proyecto como completado
            </button>
            {hayPendientes && <div className="text-xs mt-1" style={{ color: AMBER }}>Resuelve las {stats.pendientes.length} sub-actividades pendientes abajo para poder finalizar</div>}
          </div>
        )}
      </div>

      {hayPendientes && (
        <Card className="p-4" style={{ borderColor: AMBER }}>
          <div className="text-sm font-bold mb-1 flex items-center gap-2" style={{ color: NAVY }}>
            <AlertTriangle size={15} color={AMBER} /> Cierre de sub-actividades pendientes
          </div>
          <div className="text-xs mb-3" style={{ color: MUTED }}>
            Estas sub-actividades no quedaron en "Completado". Si tu proyecto no necesitó alguna de ellas, márcala como "No aplica" para que no afecte el % de avance real.
          </div>
          <div className="flex flex-col gap-2 max-h-72 overflow-y-auto">
            {stats.pendientes.map((p) => (
              <div key={`${p.fase}|||${p.sub}`} className="flex items-center justify-between gap-3 px-3 py-2 rounded-lg" style={{ background: BG }}>
                <div className="text-sm">
                  <span className="font-semibold" style={{ color: SLATE }}>{p.faseNombre}</span>
                  <span style={{ color: MUTED }}> — {p.sub}</span>
                  <span className="ml-2"><Pill color={ESTADO_COLOR[p.estadoActual] || MUTED}>{p.estadoActual}</Pill></span>
                </div>
                <div className="flex gap-2 flex-shrink-0">
                  <button onClick={() => onResolverSub(p.fase, p.sub, "Completado")}
                    className="px-2.5 py-1 rounded-md text-xs font-semibold text-white" style={{ background: GREEN }}>✓ Completada</button>
                  <button onClick={() => onResolverSub(p.fase, p.sub, "No aplica")}
                    className="px-2.5 py-1 rounded-md text-xs font-semibold border" style={{ borderColor: MUTED, color: MUTED }}>No aplica</button>
                </div>
              </div>
            ))}
          </div>
        </Card>
      )}

      <div className="flex gap-3 flex-wrap">
        <KpiCard icon={<Gauge size={15} />} label="Avance" value={`${round1(stats.porcentaje * 100)}%`} sub={`${stats.completadas}/${stats.aplicables} aplicables${stats.noAplica ? ` · ${stats.noAplica} no aplica` : ""}`} accent={STEEL} />
        <KpiCard icon={<Clock size={15} />} label="Días de obra reales" value={stats.diasObraReales || "—"} sub="días con registro" accent={NAVY} />
        <KpiCard icon={<Ruler size={15} />} label="Área total" value={`${round1(stats.area)} m²`} accent={NAVY} />
        <KpiCard icon={<PorticoIcon size={15} color={NAVY} />} label="Pórticos" value={stats.porticosTotal || "—"} accent={NAVY} />
        <KpiCard icon={<Users size={15} />} label="Personal promedio" value={stats.personalProm ? round1(stats.personalProm) : "—"} accent={AMBER} />
        <KpiCard icon={<MapPin size={15} />} label="Rendimiento" value={stats.m2dia ? `${round1(stats.m2dia)} m²/d` : "—"} sub={stats.porticosDia ? `${round2(stats.porticosDia)} pórticos/d` : ""} accent={GREEN} />
      </div>

      {selected.etapas && selected.etapas.length > 0 && (
        <Card className="p-4">
          <div className="text-sm font-bold mb-3" style={{ color: NAVY }}>Estado por etapa</div>
          <div className="grid md:grid-cols-2 gap-3">
            {stats.etapasStats.map((et) => {
              const diasDuracion = et.fechaInicio && et.fechaFin
                ? Math.max(0, Math.round((new Date(et.fechaFin) - new Date(et.fechaInicio)) / 86400000))
                : null;
              return (
                <div key={et.id} className="rounded-lg p-3" style={{ background: BG, border: `1px solid ${LINE}` }}>
                  <div className="flex justify-between items-start mb-2">
                    <div>
                      <div className="font-bold text-sm" style={{ color: NAVY }}>Etapa {et.index+1}</div>
                      {et.responsable && <div className="text-xs" style={{ color: MUTED }}>{et.responsable}</div>}
                    </div>
                    <Pill color={et.estado === "Completado" ? GREEN : et.estado === "En curso" ? STEEL : MUTED}>{et.estado || "En curso"}</Pill>
                  </div>
                  <div className="flex gap-3 text-xs mb-2 flex-wrap" style={{ color: MUTED }}>
                    <span>{round1((parseFloat(et.ancho)||0)*(parseFloat(et.largo)||0))} m²</span>
                    <span>{et.porticos || "—"} pórticos</span>
                    {et.fechaInicio && <span>Inicio: {new Date(et.fechaInicio+"T12:00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short"})}</span>}
                    {et.fechaFin && <span>Fin: {new Date(et.fechaFin+"T12:00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short"})}</span>}
                    {diasDuracion !== null && <span>{diasDuracion} días</span>}
                  </div>
                  <div className="w-full rounded-full h-2 mb-1" style={{ background: "#E0E0E0" }}>
                    <div className="h-2 rounded-full" style={{ width: `${et.pct*100}%`, background: et.pct >= 1 ? GREEN : STEEL }} />
                  </div>
                  <div className="text-xs" style={{ color: MUTED }}>
                    {et.registradas ? `${et.completadas}/${et.registradas} actividades completadas` : "Sin actividades registradas en esta etapa"}
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-3 pt-3 flex items-center justify-between" style={{ borderTop: `1px solid ${LINE}` }}>
            <span className="text-sm font-bold" style={{ color: NAVY }}>Proyecto completo</span>
            <div className="flex items-center gap-3">
              <div className="w-40 rounded-full h-2" style={{ background: "#E0E0E0" }}>
                <div className="h-2 rounded-full" style={{ width: `${stats.porcentaje*100}%`, background: stats.porcentaje >= 1 ? GREEN : STEEL }} />
              </div>
              <span className="text-sm font-bold" style={{ color: stats.porcentaje >= 1 ? GREEN : STEEL }}>{round1(stats.porcentaje*100)}%</span>
            </div>
          </div>
        </Card>
      )}

      <div className="grid md:grid-cols-2 gap-4">
        <Card className="p-4">
          <div className="text-sm font-bold mb-2" style={{ color: NAVY }}>Horas trabajadas por fase</div>
          <SimpleBarChart data={chartData} dataKey="horas" height={240} color={STEEL} />
        </Card>

        <Card className="p-4">
          <div className="text-sm font-bold mb-2" style={{ color: NAVY }}>Avance acumulado (% sub-actividades completadas)</div>
          {stats.tendencia.length > 1 ? (
            <SimpleLineChart data={stats.tendencia} dataKey="avance" height={240} color={GREEN} />
          ) : (
            <div className="h-[240px] flex items-center justify-center text-sm" style={{ color: MUTED }}>Agrega más registros para ver la tendencia</div>
          )}
        </Card>
      </div>

      <Card className="p-4">
        <div className="text-sm font-bold mb-3" style={{ color: NAVY }}>Avance por fase</div>
        <div className="flex flex-col gap-3">
          {stats.fasesStats.map((f) => (
            <div key={f.key}>
              <div className="flex justify-between text-xs mb-1" style={{ color: SLATE }}>
                <span className="font-semibold flex items-center gap-1.5"><PorticoIcon size={12} color={MUTED} />{f.key.replace("FASE ", "Fase ")} — {f.nombre}</span>
                <span style={{ color: MUTED }}>
                  {f.completadas}/{f.aplicablesFase}{f.noAplicaFase ? ` (${f.noAplicaFase} no aplica)` : ""} · {f.dias} días obra
                </span>
              </div>
              <div className="w-full rounded-full h-2" style={{ background: BG }}>
                <div className="h-2 rounded-full" style={{ width: `${f.pct * 100}%`, background: f.pct === 1 ? GREEN : STEEL }} />
              </div>
            </div>
          ))}
        </div>
      </Card>

      {stats.totalHorasTM > 0 && (
        <Card className="p-4" style={{ borderColor: AMBER }}>
          <div className="text-sm font-bold mb-3 flex items-center gap-2" style={{ color: NAVY }}>
            <AlertTriangle size={16} color={AMBER} />
            Tiempos muertos — {stats.totalHorasTM} h improductivas registradas
          </div>
          <div className="flex flex-col gap-2">
            {Object.entries(stats.tmPorMotivo).sort((a,b)=>b[1]-a[1]).map(([motivo, horas]) => {
              const pct = stats.totalHorasTM ? horas / stats.totalHorasTM : 0;
              return (
                <div key={motivo}>
                  <div className="flex justify-between text-xs mb-0.5">
                    <span style={{ color: SLATE }}>{motivo}</span>
                    <span className="font-bold" style={{ color: AMBER }}>{round2(horas)} h</span>
                  </div>
                  <div className="w-full rounded-full h-1.5" style={{ background: BG }}>
                    <div className="h-1.5 rounded-full" style={{ width: `${pct*100}%`, background: AMBER }} />
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-3 text-xs" style={{ color: MUTED }}>
            Días de obra equivalentes perdidos: <strong>{round2(stats.totalHorasTM / (stats.jornadaProm || 9.67))}</strong> días (basado en jornada promedio de {round2(stats.jornadaProm)} h/día)
          </div>
        </Card>
      )}
    </div>
  );
}

function HistoricoTab({ projects }) {
  const completados = projects.filter((p) => p.estado === "Completado" && p.resultados);
  return (
    <div className="flex flex-col gap-4">
      <h2 className="text-lg font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Histórico de proyectos completados</h2>
      {completados.length === 0 ? (
        <Card className="p-10 text-center">
          <Archive size={28} style={{ color: MUTED, margin: "0 auto" }} />
          <div className="mt-2 text-sm" style={{ color: MUTED }}>Aún no hay proyectos marcados como completados.<br />Usa el botón "Marcar proyecto como completado" en el Dashboard cuando termines uno.</div>
        </Card>
      ) : (
        <Card className="overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead style={{ background: BG }}>
                <tr>
                  {["Proyecto", "Cliente", "Ubicación", "Área (m²)", "Pórticos", "Días obra", "m²/día", "Pórticos/día", "Personal prom."].map((h) => (
                    <th key={h} className="text-left px-3 py-2 font-semibold whitespace-nowrap" style={{ color: MUTED, fontSize: 11, textTransform: "uppercase" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {completados.map((p) => (
                  <tr key={p.id} style={{ borderTop: `1px solid ${LINE}` }}>
                    <td className="px-3 py-2 font-semibold whitespace-nowrap">{p.nombre}</td>
                    <td className="px-3 py-2 whitespace-nowrap">{p.cliente}</td>
                    <td className="px-3 py-2 whitespace-nowrap">{p.ubicacion}</td>
                    <td className="px-3 py-2">{round1(projectTotals(p).area)}</td>
                    <td className="px-3 py-2">{projectTotals(p).porticos}</td>
                    <td className="px-3 py-2">{p.resultados.diasObraReales}</td>
                    <td className="px-3 py-2">{p.resultados.m2dia ? round1(p.resultados.m2dia) : "—"}</td>
                    <td className="px-3 py-2">{p.resultados.porticosDia ? round2(p.resultados.porticosDia) : "—"}</td>
                    <td className="px-3 py-2">{p.resultados.personalProm ? round1(p.resultados.personalProm) : "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {completados.length > 0 && (
        <Card className="p-4">
          <div className="text-sm font-bold mb-3 flex items-center gap-2" style={{ color: NAVY }}><AlertTriangle size={15} color={AMBER} />Tiempos estándar por fase (promedio histórico)</div>
          <div className="grid md:grid-cols-3 gap-3">
            {FASES.map((f) => {
              const vals = completados.map((p) => p.resultados.fases.find((x) => x.key === f.key)?.dias).filter((v) => v != null);
              const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
              return (
                <div key={f.key} className="p-3 rounded-lg" style={{ background: BG }}>
                  <div className="text-xs font-semibold" style={{ color: SLATE }}>{f.key.replace("FASE ", "Fase ")}</div>
                  <div className="text-xs mb-1" style={{ color: MUTED }}>{f.nombre}</div>
                  <div className="text-lg font-bold" style={{ color: NAVY, fontFamily: "'Space Grotesk', sans-serif" }}>{avg != null ? `${round2(avg)} días` : "—"}</div>
                </div>
              );
            })}
          </div>
        </Card>
      )}
    </div>
  );
}

// ================= COMPONENTES DE MANTENIMIENTO =================
function MantEmptyState({ setTab }) {
  return (
    <Card className="p-10 text-center">
      <Building2 size={32} style={{ color: MUTED, margin: "0 auto" }} />
      <div className="mt-3 font-semibold" style={{ color: SLATE }}>No tienes un mantenimiento seleccionado</div>
      <div className="text-sm mt-1" style={{ color: MUTED }}>Crea o elige un mantenimiento para continuar.</div>
      <button onClick={() => setTab("mantenimientos")} className="mt-4 px-4 py-2 rounded-lg text-white text-sm font-semibold" style={{ background: AMBER }}>
        Ir a Mantenimientos
      </button>
    </Card>
  );
}

function MantenimientosTab({ mantenimientos, selectedMantId, setSelectedMantId, setTab, showNewMant, setShowNewMant, mantDraft, setMantDraft, onCreate, onDelete, emptyMant }) {
  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h2 className="text-lg font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Mantenimientos</h2>
        <button onClick={() => { setMantDraft(emptyMant()); setShowNewMant((v) => !v); }} className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-white text-sm font-semibold" style={{ background: AMBER }}>
          <Plus size={16} /> Nuevo mantenimiento
        </button>
      </div>

      {showNewMant && (
        <Card className="p-4">
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            <Field label="Nombre / Código"><input className={inputCls} style={inputStyle} value={mantDraft.nombre} onChange={(e) => setMantDraft({ ...mantDraft, nombre: e.target.value })} placeholder="Ej: MTTO-2026-001" /></Field>
            <Field label="Cliente"><input className={inputCls} style={inputStyle} value={mantDraft.cliente} onChange={(e) => setMantDraft({ ...mantDraft, cliente: e.target.value })} /></Field>
            <Field label="Ubicación"><input className={inputCls} style={inputStyle} value={mantDraft.ubicacion} onChange={(e) => setMantDraft({ ...mantDraft, ubicacion: e.target.value })} /></Field>
            <div className="md:col-span-3"><Field label="Descripción del trabajo"><input className={inputCls} style={inputStyle} value={mantDraft.descripcion} onChange={(e) => setMantDraft({ ...mantDraft, descripcion: e.target.value })} placeholder="Descripción general del mantenimiento requerido..." /></Field></div>
          </div>
          <div className="flex justify-end mt-3">
            <button onClick={onCreate} className="px-4 py-2 rounded-lg text-white text-sm font-semibold" style={{ background: GREEN }}>Crear mantenimiento</button>
          </div>
        </Card>
      )}

      {mantenimientos.length === 0 && !showNewMant && (
        <Card className="p-10 text-center">
          <FolderKanban size={28} style={{ color: MUTED, margin: "0 auto" }} />
          <div className="mt-2 text-sm" style={{ color: MUTED }}>Aún no tienes mantenimientos. Crea uno nuevo.</div>
        </Card>
      )}

      <div className="grid md:grid-cols-2 gap-3">
        {mantenimientos.map((m) => (
          <Card key={m.id} className="p-4 cursor-pointer transition" style={{ borderColor: selectedMantId === m.id ? AMBER : LINE, borderWidth: selectedMantId === m.id ? 2 : 1 }}
            onClick={() => { setSelectedMantId(m.id); setTab("mant-seguimiento"); }}>
            <div className="flex justify-between items-start">
              <div>
                <div className="font-bold" style={{ color: NAVY }}>{m.nombre || "(sin nombre)"}</div>
                <div className="text-xs flex items-center gap-1 mt-0.5" style={{ color: MUTED }}><MapPin size={12} />{m.ubicacion || "Ubicación sin definir"}</div>
              </div>
              <div className="flex items-center gap-2">
                <Pill color={m.estado === "Completado" ? GREEN : AMBER}>{m.estado}</Pill>
                <button onClick={(e) => { e.stopPropagation(); onDelete(m.id); }} className="p-1 rounded-lg" title="Eliminar"><Trash2 size={15} style={{ color: "#C0392B" }} /></button>
              </div>
            </div>
            {m.descripcion && <div className="text-xs mt-2" style={{ color: MUTED }}>{m.descripcion}</div>}
            <div className="flex justify-end mt-2"><ChevronRight size={16} style={{ color: AMBER }} /></div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function MantDatosTab({ draft, setDraft, onSave }) {
  return (
    <div className="flex flex-col gap-4">
      <h2 className="text-lg font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Datos del mantenimiento</h2>
      <Card className="p-5">
        <div className="grid md:grid-cols-3 gap-4">
          <Field label="Nombre / Código"><input className={inputCls} style={inputStyle} value={draft.nombre || ""} onChange={(e) => setDraft({ ...draft, nombre: e.target.value })} /></Field>
          <Field label="Cliente"><input className={inputCls} style={inputStyle} value={draft.cliente || ""} onChange={(e) => setDraft({ ...draft, cliente: e.target.value })} /></Field>
          <Field label="Ubicación"><input className={inputCls} style={inputStyle} value={draft.ubicacion || ""} onChange={(e) => setDraft({ ...draft, ubicacion: e.target.value })} /></Field>
          <div className="md:col-span-3"><Field label="Descripción del trabajo"><input className={inputCls} style={inputStyle} value={draft.descripcion || ""} onChange={(e) => setDraft({ ...draft, descripcion: e.target.value })} /></Field></div>
          <Field label="Fecha inicio"><input type="date" className={inputCls} style={inputStyle} value={draft.fechaInicio || ""} onChange={(e) => setDraft({ ...draft, fechaInicio: e.target.value })} /></Field>
          <Field label="Fecha fin"><input type="date" className={inputCls} style={inputStyle} value={draft.fechaFin || ""} onChange={(e) => setDraft({ ...draft, fechaFin: e.target.value })} /></Field>
          <Field label="Estado">
            <select className={inputCls} style={inputStyle} value={draft.estado || "En curso"} onChange={(e) => setDraft({ ...draft, estado: e.target.value })}>
              {["En curso", "Completado", "Suspendido", "Programado"].map((s) => <option key={s}>{s}</option>)}
            </select>
          </Field>
        </div>
        <div className="flex justify-end mt-5">
          <button onClick={onSave} className="flex items-center gap-2 px-4 py-2 rounded-lg text-white text-sm font-semibold" style={{ background: GREEN }}><Save size={16} /> Guardar cambios</button>
        </div>
      </Card>
    </div>
  );
}

function MantFilaActividad({ fila, onChange, onRemove, canRemove }) {
  return (
    <div className="rounded-lg p-3 mb-2" style={{ background: BG }}>
      <div className="grid md:grid-cols-4 gap-3">
        <div className="md:col-span-2">
          <Field label="Actividad de mantenimiento">
            <select className={inputCls} style={{ ...inputStyle, width: "100%" }} value={fila.actividad} onChange={(e) => onChange({ actividad: e.target.value })}>
              {ACTIVIDADES_MANTENIMIENTO.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Estado">
          <select className={inputCls} style={inputStyle} value={fila.estado} onChange={(e) => onChange({ estado: e.target.value })}>
            {ESTADOS.map((s) => <option key={s}>{s}</option>)}
          </select>
        </Field>
        <Field label="# Personal"><input type="number" className={inputCls} style={inputStyle} value={fila.personal} onChange={(e) => onChange({ personal: e.target.value })} /></Field>
        <Field label="Hora inicio"><input type="time" className={inputCls} style={inputStyle} value={fila.horaInicio} onChange={(e) => onChange({ horaInicio: e.target.value })} /></Field>
        <Field label="Hora fin"><input type="time" className={inputCls} style={inputStyle} value={fila.horaFin} onChange={(e) => onChange({ horaFin: e.target.value })} /></Field>
        <Field label="Responsable">
          <select className={inputCls} style={inputStyle} value={fila.responsable || ""} onChange={(e) => onChange({ responsable: e.target.value })}>
            <option value="">Selecciona...</option>
            {RESPONSABLES.map((r) => <option key={r} value={r}>{r}</option>)}
          </select>
        </Field>
        <div className="md:col-span-3"><Field label="Observaciones"><input className={inputCls} style={inputStyle} value={fila.obs} onChange={(e) => onChange({ obs: e.target.value })} /></Field></div>
        <div className="flex items-end justify-end">
          {canRemove && <button onClick={onRemove} className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold border" style={{ borderColor: "#C0392B", color: "#C0392B" }}><Trash2 size={14} /> Quitar</button>}
        </div>
      </div>
    </div>
  );
}

function MantSeguimientoTab({ fechaRegistro, setFechaRegistro, filas, updateFila, addFila, removeFila, onGuardar, entries, onDelete, tiempoMuerto, setTiempoMuerto, showTM, setShowTM, onGuardarTM }) {
  const actEntries = entries.filter(e => e.tipo !== "tiempo_muerto");
  const tmEntries = entries.filter(e => e.tipo === "tiempo_muerto");
  const filtered = actEntries.slice().sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
  const totalHorasTM = round2(tmEntries.reduce((a,e)=>a+(parseFloat(e.duracionH)||0),0));
  return (
    <div className="flex flex-col gap-4">
      <h2 className="text-lg font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Registro de actividades de mantenimiento</h2>
      <Card className="p-5">
        <div className="mb-3">
          <Field label="Fecha del registro"><input type="date" className={inputCls} style={inputStyle} value={fechaRegistro} onChange={(e) => setFechaRegistro(e.target.value)} /></Field>
        </div>
        {filas.map((fila) => (
          <MantFilaActividad key={fila.id} fila={fila} onChange={(patch) => updateFila(fila.id, patch)} onRemove={() => removeFila(fila.id)} canRemove={filas.length > 1} />
        ))}
        <div className="flex items-center gap-2 mt-2">
          <button onClick={addFila} className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold border" style={{ borderColor: STEEL, color: STEEL }}><Plus size={15} /> Agregar otra actividad</button>
          <button onClick={onGuardar} className="flex items-center gap-2 px-4 py-2 rounded-lg text-white text-sm font-semibold" style={{ background: NAVY }}><Save size={16} /> Guardar registros del día</button>
        </div>
      </Card>

      <div className="text-sm font-semibold" style={{ color: SLATE }}>Registros ({filtered.length})</div>
      <Card className="overflow-hidden">
        <div className="overflow-x-auto max-h-[420px]">
          <table className="w-full text-sm">
            <thead style={{ background: BG }}>
              <tr>{["Fecha","Actividad","Horario","Personal","Responsable","Estado",""].map((h) => <th key={h} className="text-left px-3 py-2 font-semibold whitespace-nowrap" style={{ color: MUTED, fontSize: 11, textTransform: "uppercase" }}>{h}</th>)}</tr>
            </thead>
            <tbody>
              {filtered.map((e) => (
                <tr key={e.id} style={{ borderTop: `1px solid ${LINE}` }}>
                  <td className="px-3 py-2 whitespace-nowrap">{new Date(e.fecha+"T12:00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}</td>
                  <td className="px-3 py-2">{e.actividad}</td>
                  <td className="px-3 py-2 whitespace-nowrap">{e.horaInicio}–{e.horaFin}</td>
                  <td className="px-3 py-2 text-center">{e.personal || "—"}</td>
                  <td className="px-3 py-2 whitespace-nowrap">{e.responsable || "—"}</td>
                  <td className="px-3 py-2"><Pill color={ESTADO_COLOR[e.estado]}>{e.estado}</Pill></td>
                  <td className="px-3 py-2"><button onClick={() => onDelete(e.id)}><Trash2 size={15} style={{ color: "#C0392B" }} /></button></td>
                </tr>
              ))}
              {filtered.length === 0 && <tr><td colSpan={7} className="px-3 py-8 text-center" style={{ color: MUTED }}>Aún no hay registros. Agrega el primero arriba.</td></tr>}
            </tbody>
          </table>
        </div>
      </Card>

      {/* Tiempos muertos */}
      <div className="flex items-center justify-between mt-2">
        <div className="text-sm font-bold flex items-center gap-2" style={{ color: NAVY }}><AlertTriangle size={16} color={AMBER} /> Tiempos muertos / Improductivos</div>
        <button onClick={() => setShowTM(v => !v)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold border" style={{ borderColor: AMBER, color: AMBER }}><Plus size={14} /> {showTM ? "Cancelar" : "Registrar tiempo muerto"}</button>
      </div>
      {showTM && (
        <Card className="p-4" style={{ borderColor: AMBER }}>
          <div className="grid md:grid-cols-3 gap-3">
            <div className="md:col-span-3"><Field label="Motivo del tiempo muerto">
              <select className={inputCls} style={inputStyle} value={tiempoMuerto.motivo} onChange={e => setTiempoMuerto({...tiempoMuerto, motivo: e.target.value})}>
                {MOTIVOS_TIEMPO_MUERTO.map(m => <option key={m} value={m}>{m}</option>)}
              </select></Field></div>
            <Field label="Hora inicio"><input type="time" className={inputCls} style={inputStyle} value={tiempoMuerto.horaInicio} onChange={e => setTiempoMuerto({...tiempoMuerto, horaInicio: e.target.value})} /></Field>
            <Field label="Hora fin"><input type="time" className={inputCls} style={inputStyle} value={tiempoMuerto.horaFin} onChange={e => setTiempoMuerto({...tiempoMuerto, horaFin: e.target.value})} /></Field>
            <Field label="Duración"><input disabled className={inputCls} style={{...inputStyle, background: BG}} value={(() => { const hi = tiempoMuerto.horaInicio.split(":").map(Number); const hf = tiempoMuerto.horaFin.split(":").map(Number); return Math.max(0,(hf[0]+hf[1]/60)-(hi[0]+hi[1]/60)).toFixed(2)+" h"; })()} /></Field>
            <div className="md:col-span-3"><Field label="Descripción / observaciones"><input className={inputCls} style={inputStyle} value={tiempoMuerto.obs} onChange={e => setTiempoMuerto({...tiempoMuerto, obs: e.target.value})} /></Field></div>
          </div>
          <div className="flex justify-end mt-3"><button onClick={onGuardarTM} className="flex items-center gap-2 px-4 py-2 rounded-lg text-white text-sm font-semibold" style={{ background: AMBER }}><Save size={16} /> Guardar tiempo muerto</button></div>
        </Card>
      )}
      {tmEntries.length > 0 && (
        <Card className="overflow-hidden">
          <div className="px-4 pt-3 pb-1 text-xs font-bold" style={{ color: AMBER }}>TIEMPOS MUERTOS — {totalHorasTM} h total improductivas</div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead style={{ background: "#FFF8EE" }}><tr>{["Fecha","Motivo","Horario","Duración","Observaciones",""].map(h => <th key={h} className="text-left px-3 py-2 font-semibold whitespace-nowrap" style={{ color: AMBER, fontSize: 11, textTransform: "uppercase" }}>{h}</th>)}</tr></thead>
              <tbody>
                {tmEntries.slice().sort((a,b) => a.fecha < b.fecha ? 1 : -1).map(e => (
                  <tr key={e.id} style={{ borderTop: `1px solid ${LINE}` }}>
                    <td className="px-3 py-2 whitespace-nowrap">{new Date(e.fecha+"T12:00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}</td>
                    <td className="px-3 py-2">{e.motivo}</td>
                    <td className="px-3 py-2 whitespace-nowrap">{e.horaInicio}–{e.horaFin}</td>
                    <td className="px-3 py-2 text-center font-bold" style={{ color: AMBER }}>{parseFloat(e.duracionH).toFixed(2)} h</td>
                    <td className="px-3 py-2" style={{ color: MUTED }}>{e.obs || "—"}</td>
                    <td className="px-3 py-2"><button onClick={() => onDelete(e.id)}><Trash2 size={15} style={{ color: "#C0392B" }} /></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      )}
    </div>
  );
}

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
