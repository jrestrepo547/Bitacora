    var React = window.React;

    var firebase = window.firebase;

    async function importarDatos(jsonText) {
      var data = JSON.parse(jsonText);
      if (!data.projects || !data.entries) throw new Error("Formato inválido");
      await Promise.all(data.projects.map(function(p) { return saveProject(p); }));
      for (var pid in data.entries) {
        var ents = data.entries[pid];
        if (ents.length) await saveEntries(pid, ents);
      }
      return data.projects.length;
    }

// ---------- Firebase Storage Layer ----------
async function loadProjects() {
  try {
    if (!window.__db) return [];
    const snap = await firebase.firestore().collection("projects").get();
    return snap.docs.map(d => d.data());
  } catch(e) { console.error(e); return []; }
}
async function saveProject(project) {
  try { await firebase.firestore().collection("projects").doc(project.id).set(project); }
  catch(e) { console.error(e); }
}
async function saveProjects(list) {
  try { await Promise.all(list.map(p => saveProject(p))); } catch(e) { console.error(e); }
}
async function loadEntries(projectId) {
  try {
    const snap = await firebase.firestore().collection("entries_" + projectId).get();
    return snap.docs.map(d => d.data());
  } catch(e) { console.error(e); return []; }
}
async function saveEntries(projectId, entries) {
  try {
    await Promise.all(entries.map(e => firebase.firestore().collection("entries_" + projectId).doc(e.id).set(e)));
  } catch(e) { console.error("saveEntries error:", e); }
}
async function saveNewEntries(projectId, newEntries) {
  try {
    await Promise.all(newEntries.map(e => firebase.firestore().collection("entries_" + projectId).doc(e.id).set(e)));
  } catch(e) { console.error("saveNewEntries error:", e); }
}
async function deleteEntry(projectId, entryId) {
  try { await firebase.firestore().collection("entries_" + projectId).doc(entryId).delete(); }
  catch(e) { console.error(e); }
}
async function deleteProject(projectId) {
  try {
    // Borrar el proyecto
    await firebase.firestore().collection("projects").doc(projectId).delete();
    // Borrar todos sus registros
    const snap = await firebase.firestore().collection("entries_" + projectId).get();
    await Promise.all(snap.docs.map(d => d.ref.delete()));
  } catch(e) { console.error(e); }
}

// ---------- Firebase: Mantenimientos ----------
async function loadMantenimientos() {
  try {
    if (!window.__db) return [];
    const snap = await firebase.firestore().collection("mantenimientos").get();
    return snap.docs.map(d => d.data());
  } catch(e) { console.error(e); return []; }
}
async function saveMantenimiento(m) {
  try { await firebase.firestore().collection("mantenimientos").doc(m.id).set(m); }
  catch(e) { console.error(e); }
}
async function deleteMantenimiento(mId) {
  try {
    await firebase.firestore().collection("mantenimientos").doc(mId).delete();
    const snap = await firebase.firestore().collection("mant_entries_" + mId).get();
    await Promise.all(snap.docs.map(d => d.ref.delete()));
  } catch(e) { console.error(e); }
}
async function loadMantEntries(mId) {
  try {
    const snap = await firebase.firestore().collection("mant_entries_" + mId).get();
    return snap.docs.map(d => d.data());
  } catch(e) { console.error(e); return []; }
}
async function saveNewMantEntries(mId, newEntries) {
  try {
    await Promise.all(newEntries.map(e => firebase.firestore().collection("mant_entries_" + mId).doc(e.id).set(e)));
  } catch(e) { console.error("saveNewMantEntries error:", e); }
}
async function deleteMantEntry(mId, entryId) {
  try { await firebase.firestore().collection("mant_entries_" + mId).doc(entryId).delete(); }
  catch(e) { console.error(e); }
}

    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"
      style={{display:'inline-block', verticalAlign:'middle', ...style}} {...rest}>
      <path d={path}/>
    </svg>
  );
}

// ---------- Simple SVG Charts (reemplazo de Recharts) ----------
function SimpleBarChart({ data, dataKey, width="100%", height=240, color="#2E75B6" }) {
  const vals = data.map(d => parseFloat(d[dataKey]) || 0);
  const maxVal = Math.max(...vals, 1);
  const barW = 28;
  const gap = 8;
  const totalW = data.length * (barW + gap);
  const chartH = height - 40;
  return (
    <div style={{width:"100%", overflowX:"auto"}}>
      <svg width={Math.max(totalW, 300)} height={height} style={{display:"block",margin:"0 auto"}}>
        {data.map((d, i) => {
          const barH = Math.round((vals[i] / maxVal) * chartH);
          const x = i * (barW + gap) + gap;
          const y = chartH - barH;
          return (
            <g key={i}>
              <rect x={x} y={y} width={barW} height={barH} rx={4} fill={color} />
              <text x={x + barW/2} y={chartH + 16} textAnchor="middle" fontSize={10} fill="#64748B">{d.name}</text>
              {barH > 12 && <text x={x + barW/2} y={y + 12} textAnchor="middle" fontSize={9} fill="white">{vals[i]}</text>}
            </g>
          );
        })}
        <line x1={0} y1={chartH} x2={totalW} y2={chartH} stroke="#DDE3ED" strokeWidth={1}/>
      </svg>
    </div>
  );
}

function SimpleLineChart({ data, dataKey, width="100%", height=240, color="#2E7D52" }) {
  const vals = data.map(d => parseFloat(d[dataKey]) || 0);
  const maxVal = Math.max(...vals, 1);
  const minVal = 0;
  const padL = 32, padR = 12, padT = 12, padB = 30;
  const W = 480, H = height;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const pts = vals.map((v, i) => {
    const x = padL + (i / Math.max(vals.length - 1, 1)) * chartW;
    const y = padT + chartH - ((v - minVal) / (maxVal - minVal)) * chartH;
    return [x, y];
  });
  const polyline = pts.map(p => p.join(",")).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
      <line x1={padL} y1={padT} x2={padL} y2={padT+chartH} stroke="#DDE3ED" strokeWidth={1}/>
      <line x1={padL} y1={padT+chartH} x2={padL+chartW} y2={padT+chartH} stroke="#DDE3ED" strokeWidth={1}/>
      <polyline points={polyline} fill="none" stroke={color} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map(([x, y], i) => (
        <g key={i}>
          <circle cx={x} cy={y} r={4} fill={color}/>
          <text x={x} y={H - 6} textAnchor="middle" fontSize={10} fill="#64748B">{data[i].fecha || data[i].name}</text>
          <text x={x} y={y - 8} textAnchor="middle" fontSize={9} fill={color}>{vals[i]}</text>
        </g>
      ))}
    </svg>
  );
}

// ---------- Main App ----------
function App() {
  // ---- Todos los hooks al inicio (React Rules of Hooks) ----
  const [auth, setAuth] = React.useState(false);
  const [passInput, setPassInput] = React.useState("");
  const [passError, setPassError] = React.useState(false);
  const [projects, setProjects] = React.useState([]);
  const [selectedId, setSelectedId] = React.useState(null);
  const [entries, setEntries] = React.useState([]);
  const [tab, setTab] = React.useState("proyectos");
  const [loading, setLoading] = React.useState(true);
  const [draft, setDraft] = React.useState(emptyProject());
  const [showNewForm, setShowNewForm] = React.useState(false);
  const blankFila = () => ({
    id: uid(), fase: FASES[0].key, subs: [], etapaId: "",
    horaInicio: "07:00", horaFin: "12:00", personal: "", responsable: "", estado: "En curso", obs: "",
  });
  const [fechaRegistro, setFechaRegistro] = React.useState(new Date().toISOString().slice(0, 10));
  const [filas, setFilas] = React.useState([blankFila()]);
  const [filtroFase, setFiltroFase] = React.useState("TODAS");
  const blankTM = () => ({ motivo: MOTIVOS_TIEMPO_MUERTO[0], horaInicio: "07:00", horaFin: "09:00", obs: "", etapaId: "" });
  const [tiempoMuerto, setTiempoMuerto] = React.useState(blankTM());
  const [showTM, setShowTM] = React.useState(false);

  // ---- Estado de Mantenimientos ----
  const emptyMant = () => ({ id: uid(), nombre: "", cliente: "", ubicacion: "", descripcion: "", fechaInicio: "", fechaFin: "", estado: "En curso" });
  const [mantenimientos, setMantenimientos] = React.useState([]);
  const [selectedMantId, setSelectedMantId] = React.useState(null);
  const [mantEntries, setMantEntries] = React.useState([]);
  const [mantDraft, setMantDraft] = React.useState(emptyMant());
  const [showNewMant, setShowNewMant] = React.useState(false);
  const blankMantFila = () => ({ id: uid(), actividad: ACTIVIDADES_MANTENIMIENTO[0], horaInicio: "07:00", horaFin: "12:00", personal: "", responsable: "", estado: "En curso", obs: "" });
  const [mantFechaReg, setMantFechaReg] = React.useState(new Date().toISOString().slice(0, 10));
  const [mantFilas, setMantFilas] = React.useState([blankMantFila()]);
  const [mantTM, setMantTM] = React.useState(blankTM());
  const [showMantTM, setShowMantTM] = React.useState(false);

  const handleLogin = () => {
    if (passInput === PASS_ACCESO) { setAuth(true); }
    else { setPassError(true); setTimeout(() => setPassError(false), 2000); }
  };

  // ---- TODOS los React.useEffect y React.useMemo ANTES de cualquier return condicional ----
  // (React Rules of Hooks: nunca llames hooks después de un return condicional)

  React.useEffect(() => {
    if (!auth) return; // Guard: solo corre cuando está autenticado
    document.title = "Bitácora de Montaje — ALTIX";
    (async () => {
      const p = await loadProjects();
      setProjects(p);
      if (p.length) setSelectedId(p[0].id);
      setLoading(false);
    })();
  }, [auth]); // Depende de auth para correr al hacer login

  React.useEffect(() => {
    if (!auth) return;
    if (!selectedId) { setEntries([]); return; }
    (async () => setEntries(await loadEntries(selectedId)))();
  }, [auth, selectedId]);

  React.useEffect(() => {
    if (!auth) return;
    (async () => setMantenimientos(await loadMantenimientos()))();
  }, [auth]);

  React.useEffect(() => {
    if (!auth) return;
    if (!selectedMantId) { setMantEntries([]); return; }
    (async () => setMantEntries(await loadMantEntries(selectedMantId)))();
  }, [auth, selectedMantId]);

  const selectedMant = mantenimientos.find((m) => m.id === selectedMantId) || null;
  React.useEffect(() => {
    if (!auth) return;
    if (selectedMant) setMantDraft(selectedMant);
  }, [auth, selectedMantId]);

  const selected = projects.find((p) => p.id === selectedId) || null;

  React.useEffect(() => {
    if (!auth) return;
    if (selected) setDraft(selected);
  }, [auth, selectedId]);

  const stats = React.useMemo(() => {
    if (!auth || !selected) return null;
    const { area, porticos: porticosTotal } = projectTotals(selected);
    const lv = parseFloat(selected.horasLV) || 0;
    const sab = parseFloat(selected.horasSab) || 0;
    const dom = selected.domingoLabora ? (parseFloat(selected.horasDom) || 0) : 0;
    const diasSemana = selected.domingoLabora ? 7 : 6;
    const jornadaProm = (lv * 5 + sab + dom) / diasSemana || 1;

    const horasPorFase = {};
    FASES.forEach((f) => (horasPorFase[f.key] = 0));
    const fechasSet = new Set();
    entries.forEach((e) => {
      const d = parseHora(e.horaFin) - parseHora(e.horaInicio);
      if (!isNaN(d) && d > 0) horasPorFase[e.fase] = (horasPorFase[e.fase] || 0) + d;
      if (e.fecha) fechasSet.add(e.fecha);
    });

    const latestBySub = {};
    entries.forEach((e) => {
      const k = `${e.fase}|||${e.sub}`;
      if (!latestBySub[k] || e.fecha >= latestBySub[k].fecha) latestBySub[k] = e;
    });
    const completadas = Object.values(latestBySub).filter((e) => e.estado === "Completado").length;
    const noAplica = Object.values(latestBySub).filter((e) => e.estado === "No aplica").length;
    const aplicables = Math.max(TOTAL_SUBACTIVIDADES - noAplica, 0);
    const porcentaje = aplicables ? completadas / aplicables : (TOTAL_SUBACTIVIDADES ? 1 : 0);

    const fasesStats = FASES.map((f) => {
      const totalSubs = f.subs.length;
      const completadasFase = f.subs.filter((s) => latestBySub[`${f.key}|||${s}`]?.estado === "Completado").length;
      const noAplicaFase = f.subs.filter((s) => latestBySub[`${f.key}|||${s}`]?.estado === "No aplica").length;
      const aplicablesFase = Math.max(totalSubs - noAplicaFase, 0);
      return {
        key: f.key, nombre: f.nombre,
        horas: round1(horasPorFase[f.key] || 0),
        dias: round2((horasPorFase[f.key] || 0) / jornadaProm),
        completadas: completadasFase, totalSubs, noAplicaFase, aplicablesFase,
        pct: aplicablesFase ? completadasFase / aplicablesFase : 1,
      };
    });

    const pendientes = [];
    FASES.forEach((f) => f.subs.forEach((s) => {
      const last = latestBySub[`${f.key}|||${s}`];
      const estadoActual = last ? last.estado : "Sin registro";
      if (estadoActual !== "Completado" && estadoActual !== "No aplica") {
        pendientes.push({ fase: f.key, faseNombre: f.nombre, sub: s, estadoActual });
      }
    }));

    const diasObraReales = fechasSet.size;
    const personalVals = entries.map((e) => parseFloat(e.personal)).filter((n) => !isNaN(n) && n > 0);
    const personalProm = personalVals.length ? personalVals.reduce((a, b) => a + b, 0) / personalVals.length : null;
    const m2dia = diasObraReales > 0 ? area / diasObraReales : null;
    const porticosDia = diasObraReales > 0 ? porticosTotal / diasObraReales : null;

    const fechasOrdenadas = [...fechasSet].sort();
    const tendencia = fechasOrdenadas.map((fecha) => {
      const completadasHasta = Object.values(latestBySub).filter((e) => e.estado === "Completado" && e.fecha <= fecha).length;
      return { fecha: fecha.slice(5), avance: round1((completadasHasta / Math.max(aplicables, 1)) * 100) };
    });

    // Avance por etapa — calculado aquí donde entries está en scope
    const etapasStats = (selected.etapas || []).map((et, i) => {
      const etapaEnts = entries.filter(e => e.etapaId === et.id);
      const latestEt = {};
      etapaEnts.forEach(e => {
        const k = `${e.fase}|||${e.sub}`;
        if (!latestEt[k] || e.fecha >= latestEt[k].fecha) latestEt[k] = e;
      });
      const regCount = Object.keys(latestEt).length;
      const compCount = Object.values(latestEt).filter(e => e.estado === "Completado").length;
      return { ...et, index: i, registradas: regCount, completadas: compCount, pct: regCount ? compCount / regCount : 0 };
    });

    // Análisis de tiempos muertos
    const tmEntries = entries.filter(e => e.tipo === "tiempo_muerto");
    const totalHorasTM = round2(tmEntries.reduce((a, e) => a + (parseFloat(e.duracionH) || 0), 0));
    const tmPorMotivo = {};
    tmEntries.forEach(e => {
      tmPorMotivo[e.motivo] = (tmPorMotivo[e.motivo] || 0) + (parseFloat(e.duracionH) || 0);
    });

    return { area, porticosTotal, jornadaProm, fasesStats, completadas, noAplica, aplicables, porcentaje, diasObraReales, personalProm, m2dia, porticosDia, tendencia, pendientes, etapasStats, totalHorasTM, tmPorMotivo, tmEntries };
  }, [auth, selected, entries]);

  if (!auth) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: BG }}>
        <div className="rounded-2xl shadow-lg p-8 w-full max-w-sm" style={{ background: CARD, border: `1px solid ${LINE}` }}>
          <div className="flex justify-center mb-5">
            <div className="rounded-lg px-3 py-2" style={{ background: NAVY }}>
              <img src={ALTIX_LOGO} alt="ALTIX" style={{ height: 36, width: "auto" }} />
            </div>
          </div>
          <div className="text-center mb-5">
            <div className="font-bold text-lg" style={{ color: NAVY, fontFamily: "'Space Grotesk', sans-serif" }}>Bitácora de Montaje</div>
            <div className="text-sm" style={{ color: MUTED }}>Plastextil S.A.S. — Ingeniería y Cubrimiento</div>
          </div>
          <div className="flex flex-col gap-3">
            <label className="text-sm font-medium" style={{ color: SLATE }}>
              <div className="flex items-center gap-1.5 mb-1"><Lock size={14} /> Contraseña de acceso</div>
              <input type="password" className="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:ring-2"
                style={{ borderColor: passError ? "#C0392B" : LINE, color: SLATE }}
                value={passInput} onChange={e => setPassInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && handleLogin()}
                placeholder="Ingresa la contraseña..." />
            </label>
            {passError && <div className="text-xs text-center" style={{ color: "#C0392B" }}>Contraseña incorrecta</div>}
            <button onClick={handleLogin} className="w-full py-2.5 rounded-lg text-white font-semibold text-sm" style={{ background: NAVY }}>
              Ingresar
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ---------- Actions ----------
  const handleCreateProject = async () => {
    if (!draft.nombre.trim()) return;
    const np = { ...emptyProject(), ...draft, id: uid() };
    const updated = [...projects, np];
    setProjects(updated); await saveProjects(updated);
    setDraft(np);           // ← poblar draft con el proyecto recién creado
    setSelectedId(np.id);
    setShowNewForm(false);
    setTab("datos");
  };

  const handleSaveProject = async () => {
    const updated = projects.map((p) => (p.id === selected.id ? { ...draft } : p));
    setProjects(updated); await saveProjects(updated);
  };

  const handleLoadDemo = async () => {
    const proj = seedIncolmotos();
    const updatedP = [...projects, proj];
    setProjects(updatedP); await saveProjects(updatedP);
    const ents = seedEntries(proj.id);
    await saveEntries(proj.id, ents);
    setSelectedId(proj.id); setTab("dashboard");
  };

  const handleLoadPostobon = async () => {
    const proj = seedPostobon();
    const updatedP = [...projects, proj];
    setProjects(updatedP); await saveProjects(updatedP);
    const ents = seedPostobonEntries(proj.id);
    await saveEntries(proj.id, ents);
    setSelectedId(proj.id); setTab("dashboard");
  };

  const updateFila = (id, patch) => setFilas((prev) => prev.map((f) => (f.id === id ? { ...f, ...patch } : f)));
  const addFila = () => setFilas((prev) => [...prev, blankFila()]);
  const removeFila = (id) => setFilas((prev) => (prev.length > 1 ? prev.filter((f) => f.id !== id) : prev));

  const handleGuardarDia = async () => {
    if (!fechaRegistro) { alert("Debes seleccionar una fecha."); return; }
    const validas = filas.filter((f) => f.subs && f.subs.length);
    if (!validas.length) {
      alert("Debes seleccionar al menos una sub-actividad en cada fila antes de guardar.");
      return;
    }
    const nuevas = validas.flatMap((f) =>
      f.subs.map((s) => {
        const { subs, ...rest } = f;
        return { ...rest, sub: s, fecha: fechaRegistro, projectId: selected.id, id: uid() };
      })
    );
    const updated = [...entries, ...nuevas];
    setEntries(updated);
    await saveNewEntries(selected.id, nuevas); // solo guarda los nuevos, no reescribe todos
    setFilas([blankFila()]);
  };

  const handleGuardarTM = async () => {
    if (!fechaRegistro) { alert("Debes seleccionar una fecha."); return; }
    const hi = tiempoMuerto.horaInicio.split(":").map(Number);
    const hf = tiempoMuerto.horaFin.split(":").map(Number);
    const durH = round2(Math.max(0, (hf[0] + hf[1]/60) - (hi[0] + hi[1]/60)));
    const tm = {
      id: uid(), projectId: selected.id, tipo: "tiempo_muerto",
      fecha: fechaRegistro, motivo: tiempoMuerto.motivo,
      horaInicio: tiempoMuerto.horaInicio, horaFin: tiempoMuerto.horaFin,
      duracionH: durH, obs: tiempoMuerto.obs,
      etapaId: tiempoMuerto.etapaId || "",
    };
    const updated = [...entries, tm];
    setEntries(updated);
    await saveNewEntries(selected.id, [tm]);
    setTiempoMuerto(blankTM());
    setShowTM(false);
  };

  const handleDeleteEntry = async (id) => {
    const updated = entries.filter((e) => e.id !== id);
    setEntries(updated);
    await deleteEntry(selected.id, id); // solo borra ese documento en Firebase
  };

  const handleDeleteProject = async (projectId) => {
    if (!window.confirm("¿Seguro que quieres eliminar este proyecto y todos sus registros? Esta acción no se puede deshacer.")) return;
    await deleteProject(projectId);
    const updated = projects.filter((p) => p.id !== projectId);
    setProjects(updated);
    if (selectedId === projectId) {
      setSelectedId(updated.length ? updated[0].id : null);
      setTab("proyectos");
    }
  };

  const handleResolverSub = async (fase, sub, nuevoEstado) => {
    const e = {
      id: uid(), projectId: selected.id, fecha: new Date().toISOString().slice(0, 10),
      fase, sub, horaInicio: "00:00", horaFin: "00:00", personal: "", responsable: "",
      estado: nuevoEstado, obs: "Cierre de proyecto",
    };
    const updated = [...entries, e];
    setEntries(updated);
    await saveNewEntries(selected.id, [e]); // solo guarda el nuevo
  };

  const handleFinalizar = async () => {
    if (!stats) return;
    const resultados = {
      fechaFinReal: [...entries].map((e) => e.fecha).sort().slice(-1)[0] || null,
      diasObraReales: stats.diasObraReales,
      m2dia: stats.m2dia, porticosDia: stats.porticosDia,
      fases: stats.fasesStats.map((f) => ({ key: f.key, dias: f.dias })),
      personalProm: stats.personalProm,
    };
    const updated = projects.map((p) => (p.id === selected.id ? { ...p, estado: "Completado", resultados } : p));
    setProjects(updated); await saveProjects(updated);
    setDraft({ ...selected, estado: "Completado", resultados });
  };

  // ---------- Handlers de Mantenimiento ----------
  const handleCreateMant = async () => {
    if (!mantDraft.nombre.trim()) return;
    const nm = { ...emptyMant(), ...mantDraft, id: uid() };
    const updated = [...mantenimientos, nm];
    setMantenimientos(updated); await saveMantenimiento(nm);
    setMantDraft(nm); setSelectedMantId(nm.id); setShowNewMant(false); setTab("mant-datos");
  };
  const handleSaveMant = async () => {
    const updated = mantenimientos.map((m) => (m.id === selectedMant.id ? { ...mantDraft } : m));
    setMantenimientos(updated); await saveMantenimiento({ ...mantDraft });
  };
  const handleDeleteMant = async (mId) => {
    if (!window.confirm("¿Seguro que quieres eliminar este mantenimiento y todos sus registros?")) return;
    await deleteMantenimiento(mId);
    const updated = mantenimientos.filter((m) => m.id !== mId);
    setMantenimientos(updated);
    if (selectedMantId === mId) { setSelectedMantId(updated.length ? updated[0].id : null); setTab("mantenimientos"); }
  };
  const updateMantFila = (id, patch) => setMantFilas((prev) => prev.map((f) => (f.id === id ? { ...f, ...patch } : f)));
  const addMantFila = () => setMantFilas((prev) => [...prev, blankMantFila()]);
  const removeMantFila = (id) => setMantFilas((prev) => (prev.length > 1 ? prev.filter((f) => f.id !== id) : prev));
  const handleGuardarMantDia = async () => {
    if (!mantFechaReg) { alert("Debes seleccionar una fecha."); return; }
    const validas = mantFilas.filter((f) => f.actividad);
    if (!validas.length) { alert("Debes seleccionar al menos una actividad."); return; }
    const nuevas = validas.map((f) => ({ ...f, fecha: mantFechaReg, mantId: selectedMant.id, id: uid() }));
    const updated = [...mantEntries, ...nuevas];
    setMantEntries(updated); await saveNewMantEntries(selectedMant.id, nuevas);
    setMantFilas([blankMantFila()]);
  };
  const handleDeleteMantEntry = async (id) => {
    const updated = mantEntries.filter((e) => e.id !== id);
    setMantEntries(updated); await deleteMantEntry(selectedMant.id, id);
  };
  const handleGuardarMantTM = async () => {
    if (!mantFechaReg) { alert("Debes seleccionar una fecha."); return; }
    const hi = mantTM.horaInicio.split(":").map(Number);
    const hf = mantTM.horaFin.split(":").map(Number);
    const durH = round2(Math.max(0, (hf[0] + hf[1]/60) - (hi[0] + hi[1]/60)));
    const tm = { id: uid(), mantId: selectedMant.id, tipo: "tiempo_muerto", fecha: mantFechaReg, motivo: mantTM.motivo, horaInicio: mantTM.horaInicio, horaFin: mantTM.horaFin, duracionH: durH, obs: mantTM.obs };
    const updated = [...mantEntries, tm];
    setMantEntries(updated); await saveNewMantEntries(selectedMant.id, [tm]);
    setMantTM(blankTM()); setShowMantTM(false);
  };

  // ---------- Render ----------
  const NAV = [
  const MONTAJE_TABS = [
    { id: "proyectos", label: "Proyectos", icon: <FolderKanban size={16} /> },
    { id: "datos", label: "Datos del proyecto", icon: <Building2 size={16} /> },
    { id: "seguimiento", label: "Seguimiento diario", icon: <ListChecks size={16} /> },
    { id: "dashboard", label: "Dashboard", icon: <LayoutDashboard size={16} /> },
    { id: "historico", label: "Histórico", icon: <Archive size={16} /> },
  ];
  const MANT_TABS = [
    { id: "mantenimientos", label: "Mantenimientos", icon: <FolderKanban size={16} /> },
    { id: "mant-datos", label: "Datos del mantenimiento", icon: <Building2 size={16} /> },
    { id: "mant-seguimiento", label: "Registro de actividades", icon: <ListChecks size={16} /> },
  ];
  const esModoMant = tab.startsWith("mant");
  const NAV = esModoMant ? MANT_TABS : MONTAJE_TABS;

  return (
    <div className="w-full min-h-[700px]" style={{ background: BG, fontFamily: "Inter, sans-serif", color: SLATE }}>
      {/* Header */}
      <div className="px-5 py-4 flex items-center justify-between" style={{ background: NAVY }}>

            <div className="text-white font-bold text-lg leading-tight" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Bitácora de Montaje</div>
            <div className="text-[11px]" style={{ color: "#B9C7E0" }}>Plastextil S.A.S. — Ingeniería y Cubrimiento</div>
          </div>

        {selected && !esModoMant && (
          <div className="text-right hidden sm:block">

      <div className="flex gap-2 px-4 pt-3" style={{ background: NAVY }}>

          className="px-4 py-1.5 rounded-lg text-sm font-bold transition"
          style={{ background: !esModoMant ? "#FFFFFF" : "transparent", color: !esModoMant ? NAVY : "#CBD8EE", border: `1px solid ${!esModoMant ? "#FFFFFF" : "#3A5488"}` }}>
          🏗️ Montaje de bodegas
        </button>
        <button onClick={() => setTab("mantenimientos")}
          className="px-4 py-1.5 rounded-lg text-sm font-bold transition"
          style={{ background: esModoMant ? "#FFFFFF" : "transparent", color: esModoMant ? AMBER : "#CBD8EE", border: `1px solid ${esModoMant ? "#FFFFFF" : "#3A5488"}` }}>
          🔧 Mantenimientos
        </button>
      </div>

      {/* Nav tabs */}
      <div className="flex gap-1 px-4 pt-3 overflow-x-auto" style={{ background: NAVY }}>
        {NAV.map((n) => (
          <button key={n.id} onClick={() => setTab(n.id)}
            className="flex items-center gap-1.5 px-3.5 py-2 rounded-t-lg text-sm font-semibold whitespace-nowrap transition"
            style={{
              background: tab === n.id ? BG : "transparent",
              color: tab === n.id ? NAVY : "#CBD8EE",
            }}>
            {n.icon}{n.label}
          </button>
        ))}
      </div>

      <div className="p-5 max-w-6xl mx-auto">
        {loading ? (
          <div className="text-center py-20" style={{ color: MUTED }}>Cargando...</div>
        ) : tab === "proyectos" ? (
          <ProyectosTab
            projects={projects} selectedId={selectedId} setSelectedId={setSelectedId} setTab={setTab}
            showNewForm={showNewForm} setShowNewForm={setShowNewForm}
            draft={draft} setDraft={setDraft} onCreate={handleCreateProject} onLoadDemo={handleLoadDemo} onLoadPostobon={handleLoadPostobon} onDelete={handleDeleteProject}
          />
        ) : !selected ? (
          <EmptyState setTab={setTab} setShowNewForm={setShowNewForm} />
        ) : tab === "datos" ? (
          <DatosTab draft={draft} setDraft={setDraft} onSave={handleSaveProject} stats={stats} />
        ) : tab === "seguimiento" ? (
          <SeguimientoTab
            fechaRegistro={fechaRegistro} setFechaRegistro={setFechaRegistro}
            filas={filas} updateFila={updateFila} addFila={addFila} removeFila={removeFila}
            onGuardar={handleGuardarDia} etapas={selected ? (selected.etapas || []) : []}
            tiempoMuerto={tiempoMuerto} setTiempoMuerto={setTiempoMuerto}
            showTM={showTM} setShowTM={setShowTM} onGuardarTM={handleGuardarTM}
            entries={entries} onDelete={handleDeleteEntry}
            filtroFase={filtroFase} setFiltroFase={setFiltroFase}
          />
        ) : tab === "dashboard" ? (
          <DashboardTab selected={selected} stats={stats} entries={entries} onFinalizar={handleFinalizar} onResolverSub={handleResolverSub} />
        ) : tab === "historico" ? (
          <HistoricoTab projects={projects} />
        ) : tab === "mantenimientos" ? (
          <MantenimientosTab
            mantenimientos={mantenimientos} selectedMantId={selectedMantId} setSelectedMantId={setSelectedMantId} setTab={setTab}
            showNewMant={showNewMant} setShowNewMant={setShowNewMant}
            mantDraft={mantDraft} setMantDraft={setMantDraft} onCreate={handleCreateMant} onDelete={handleDeleteMant} emptyMant={emptyMant}
          />
        ) : tab === "mant-datos" ? (
          selectedMant ? <MantDatosTab draft={mantDraft} setDraft={setMantDraft} onSave={handleSaveMant} /> : <MantEmptyState setTab={setTab} />
        ) : tab === "mant-seguimiento" ? (
          selectedMant ? <MantSeguimientoTab
            fechaRegistro={mantFechaReg} setFechaRegistro={setMantFechaReg}
            filas={mantFilas} updateFila={updateMantFila} addFila={addMantFila} removeFila={removeMantFila}
            onGuardar={handleGuardarMantDia} entries={mantEntries} onDelete={handleDeleteMantEntry}
            tiempoMuerto={mantTM} setTiempoMuerto={setMantTM} showTM={showMantTM} setShowTM={setShowMantTM} onGuardarTM={handleGuardarMantTM}
          /> : <MantEmptyState setTab={setTab} />
        ) : (
          <HistoricoTab projects={projects} />
        )}
      </div>
    </div>
  );
}

              <div>
                <div className="font-bold" style={{ color: NAVY }}>{p.nombre || "(sin nombre)"}</div>
